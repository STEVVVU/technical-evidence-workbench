[project]
name = "deerflow-extension-evidence-workbench"
version = "0.1.0"
description = "Owner-scoped technical evidence investigations for DeerFlow"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["deerflow-extension-api>=0.2.7,<0.3"]

[project.entry-points."deerflow.extensions"]
evidence-workbench = "evidence_workbench:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evidence_workbench"]
